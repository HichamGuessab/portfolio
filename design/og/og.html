<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('../../src/assets/fonts/space-grotesk-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 300 700;
        font-style: normal;
        font-display: block;
      }
      :root {
        --dark: #040d39;
        --night: #0d1953;
        --navy: #0f2c57;
        --light: #53dcfd;
        --purple: #a88cff;
        --text: #f5f5f5;
        --muted: #9ea9d3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--dark);
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        font-kerning: normal;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--dark);
      }

      /* soft brand glows */
      .glow {
        position: absolute;
        border-radius: 50%;
      }
      .glow.blue {
        width: 1100px;
        height: 1100px;
        left: -470px;
        top: -560px;
        background: radial-gradient(
          closest-side,
          rgba(83, 220, 253, 0.19),
          rgba(83, 220, 253, 0.075) 50%,
          rgba(83, 220, 253, 0) 100%
        );
      }
      .glow.purple {
        width: 1200px;
        height: 1200px;
        right: -500px;
        bottom: -640px;
        background: radial-gradient(
          closest-side,
          rgba(168, 140, 255, 0.2),
          rgba(168, 140, 255, 0.08) 50%,
          rgba(168, 140, 255, 0) 100%
        );
      }
      /* very faint dot grid, fading out towards the edges */
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(245, 245, 245, 0.16) 1px,
          transparent 1.7px
        );
        background-size: 28px 28px;
        background-position: 14px 14px;
        -webkit-mask-image: radial-gradient(
          ellipse 75% 85% at 38% 48%,
          #000 25%,
          rgba(0, 0, 0, 0.35) 65%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse 75% 85% at 38% 48%,
          #000 25%,
          rgba(0, 0, 0, 0.35) 65%,
          transparent 100%
        );
        opacity: 0.55;
      }

      .content {
        position: absolute;
        inset: 0;
        padding: 72px 80px 70px 80px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .left {
        width: 640px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .pill {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 9px 20px 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(83, 220, 253, 0.38);
        background: rgba(83, 220, 253, 0.08);
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.005em;
        color: #e3f9ff;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--light);
        box-shadow:
          0 0 0 4px rgba(83, 220, 253, 0.16),
          0 0 12px rgba(83, 220, 253, 0.85);
      }
      h1 {
        font-size: 104px;
        line-height: 0.98;
        font-weight: 600;
        letter-spacing: -0.035em;
        background: linear-gradient(
          95deg,
          var(--light) 0%,
          #86b9ff 48%,
          var(--purple) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        width: fit-content;
        padding-bottom: 8px;
        margin-left: -4px;
      }
      .subtitle {
        margin-top: 22px;
        font-size: 28px;
        line-height: 1.25;
        font-weight: 500;
        color: var(--text);
        letter-spacing: -0.005em;
      }
      .sep {
        color: var(--light);
        opacity: 0.9;
        padding: 0 0.12em;
      }
      .stack {
        margin-top: 12px;
        font-size: 22px;
        line-height: 1.3;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
      .stack .sep {
        color: var(--muted);
        opacity: 0.7;
      }
      .domain {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        font-weight: 500;
        color: var(--light);
        letter-spacing: 0.01em;
      }
      .domain::before {
        content: '';
        width: 36px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--light), var(--purple));
      }

      .right {
        position: relative;
        width: 400px;
        height: 400px;
        display: grid;
        place-items: center;
        margin-right: -6px;
      }
      .halo {
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          rgba(83, 220, 253, 0.4),
          rgba(168, 140, 255, 0.3) 58%,
          rgba(168, 140, 255, 0) 100%
        );
        filter: blur(26px);
      }
      .ring {
        position: relative;
        width: 388px;
        height: 388px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(
          140deg,
          var(--light) 10%,
          var(--purple) 90%
        );
      }
      .ring-gap {
        width: 380px;
        height: 380px;
        border-radius: 50%;
        padding: 4px;
        background: var(--dark);
        box-shadow: 0 24px 60px rgba(2, 6, 30, 0.55);
      }
      .ring img {
        display: block;
        width: 372px;
        height: 372px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow blue"></div>
      <div class="glow purple"></div>
      <div class="grid"></div>
      <div class="content">
        <div class="left">
          <div class="pill">
            <span class="dot"></span>
            Ouvert aux opportunités
          </div>
          <div class="main">
            <h1>
              Hicham
              <br />
              Guessab
            </h1>
            <p class="subtitle">
              Ingénieur logiciel
              <span class="sep">·</span>
              Développeur web &amp; mobile
            </p>
            <p class="stack">
              Front-End
              <span class="sep">·</span>
              Angular
              <span class="sep">·</span>
              TypeScript
              <span class="sep">·</span>
              Ionic
            </p>
          </div>
          <div class="domain">hichamguessab.com</div>
        </div>
        <div class="right">
          <div class="halo"></div>
          <div class="ring">
            <div class="ring-gap">
              <img src="../../src/assets/images/portrait-768.jpg" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
