@if (visible()) {
  <!-- Duo de mascottes purement décoratif (aria-hidden sur dessins et bulles).
       Ordinateur : chaque clic compte pour la surprise du triple-clic
       (bascule diaporama / compact, teasée par leurs bulles) — un personnage
       perché sur l'interface reste cliquable, le compteur suit.
       Mobile : le toucher active la réaction aux mouvements du téléphone
       (permission iOS demandée dans ce geste).
       Le duo est permanent : il porte le seul accès au mode compact. -->

  <!-- Le robot -->
  <button
    #robotSprite
    type="button"
    class="duo-sprite robot-sprite"
    (click)="onSpriteTap('robot')"
    [attr.aria-label]="spriteLabel()"
    [title]="spriteLabel()"
  >
    <!-- Bulle de dialogue : la boîte glisse pour rester dans l'écran,
         la flèche reste au-dessus de la tête. -->
    <span class="duo-bubble" aria-hidden="true">
      <span class="duo-bubble-text"></span>
    </span>
    <span class="duo-bubble-arrow" aria-hidden="true"></span>

    <span class="mascot-pop">
      <span class="mascot-flip">
        <!-- Petit robot original dessiné à la main, aux couleurs de la charte :
             corps en dégradé lightBlue → purple, détails darkBlue et wildSand.
             Il est dessiné tourné vers la droite (antenne penchée, pupilles
             décalées) : le retournement gauche/droite est un simple miroir. -->
        <svg
          class="duo-svg mascot-svg"
          viewBox="0 0 64 78"
          width="64"
          height="78"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="mascotBodyGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--light-blue)" />
              <stop offset="100%" stop-color="var(--purple)" />
            </linearGradient>
          </defs>

          <!-- Ombre au sol : hors du groupe qui rebondit -->
          <ellipse class="mascot-shadow" cx="32" cy="75" rx="13" ry="2.4" />

          <!-- Étincelles du high-five / des célébrations -->
          <g class="duo-sparkles">
            <path
              class="sparkle sparkle-1"
              d="M12 10 L13.4 13.6 L17 15 L13.4 16.4 L12 20 L10.6 16.4 L7 15 L10.6 13.6 Z"
              fill="var(--light-blue)"
            />
            <path
              class="sparkle sparkle-2"
              d="M52 6 L53.2 9 L56.2 10.2 L53.2 11.4 L52 14.4 L50.8 11.4 L47.8 10.2 L50.8 9 Z"
              fill="var(--purple)"
            />
            <path
              class="sparkle sparkle-3"
              d="M30 1 L31 3.6 L33.6 4.6 L31 5.6 L30 8.2 L29 5.6 L26.4 4.6 L29 3.6 Z"
              fill="#f5f5f5"
            />
          </g>

          <g class="mascot-figure">
            <!-- Jambes -->
            <rect
              class="mascot-leg mascot-leg-back"
              x="21.5"
              y="55"
              width="7"
              height="17"
              rx="3.5"
            />
            <rect
              class="mascot-leg mascot-leg-front"
              x="35.5"
              y="55"
              width="7"
              height="17"
              rx="3.5"
            />

            <!-- Antenne, penchée dans le sens de la marche -->
            <g class="mascot-antenna-group">
              <path
                class="mascot-antenna"
                d="M32 17 Q32.5 11 36 7.5"
                fill="none"
                stroke="var(--purple)"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle
                class="mascot-antenna-glow"
                cx="36.8"
                cy="6"
                r="5"
                fill="var(--light-blue)"
              />
              <circle cx="36.8" cy="6" r="2.6" fill="var(--light-blue)" />
            </g>

            <!-- Corps en dégradé signature -->
            <rect
              class="mascot-body"
              x="12"
              y="16"
              width="40"
              height="44"
              rx="20"
              fill="url(#mascotBodyGradient)"
            />

            <!-- Bras -->
            <rect
              class="mascot-arm mascot-arm-back"
              x="8.5"
              y="31"
              width="6"
              height="17"
              rx="3"
            />
            <rect
              class="mascot-arm mascot-arm-front"
              x="49.5"
              y="31"
              width="6"
              height="17"
              rx="3"
            />

            <!-- Visage : yeux qui clignent, pupilles qui suivent le curseur -->
            <g class="mascot-eyes">
              <circle cx="25" cy="33" r="4" fill="#f5f5f5" />
              <circle cx="40" cy="33" r="4" fill="#f5f5f5" />
              <g class="mascot-pupils">
                <circle cx="26.2" cy="33.4" r="1.9" fill="var(--dark-blue)" />
                <circle cx="41.2" cy="33.4" r="1.9" fill="var(--dark-blue)" />
              </g>
            </g>
            <path
              class="mascot-mouth"
              d="M28 42.5 Q32.5 46.5 37 42.5"
              fill="none"
              stroke="var(--dark-blue)"
              stroke-width="2"
              stroke-linecap="round"
            />
            <!-- Joues -->
            <circle cx="19.5" cy="39.5" r="2.3" fill="#f5f5f5" opacity="0.22" />
            <circle cx="45.5" cy="39.5" r="2.3" fill="#f5f5f5" opacity="0.22" />
          </g>
        </svg>
      </span>
    </span>
  </button>

  <!-- L'ami : un petit blob tout mignon qui sautille derrière le robot.
       Dessiné tourné vers la droite lui aussi (pupilles décalées). -->
  <button
    #buddySprite
    type="button"
    class="duo-sprite buddy-sprite"
    (click)="onSpriteTap('buddy')"
    [attr.aria-label]="spriteLabel()"
    [title]="spriteLabel()"
  >
    <span class="duo-bubble" aria-hidden="true">
      <span class="duo-bubble-text"></span>
    </span>
    <span class="duo-bubble-arrow" aria-hidden="true"></span>

    <span class="mascot-pop">
      <span class="mascot-flip">
        <svg
          class="duo-svg buddy-svg"
          viewBox="0 0 48 56"
          width="48"
          height="56"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="buddyBodyGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--purple)" />
              <stop offset="100%" stop-color="var(--light-blue)" />
            </linearGradient>
          </defs>

          <!-- Ombre au sol : hors du groupe qui sautille -->
          <ellipse class="buddy-shadow" cx="24" cy="52.5" rx="11" ry="2.2" />

          <!-- Étincelles du high-five -->
          <g class="duo-sparkles">
            <path
              class="sparkle sparkle-1"
              d="M8 6 L9.2 9 L12.2 10.2 L9.2 11.4 L8 14.4 L6.8 11.4 L3.8 10.2 L6.8 9 Z"
              fill="var(--light-blue)"
            />
            <path
              class="sparkle sparkle-2"
              d="M40 4 L41.2 7 L44.2 8.2 L41.2 9.4 L40 12.4 L38.8 9.4 L35.8 8.2 L38.8 7 Z"
              fill="#f5f5f5"
            />
            <path
              class="sparkle sparkle-3"
              d="M24 0 L25 2.6 L27.6 3.6 L25 4.6 L24 7.2 L23 4.6 L20.4 3.6 L23 2.6 Z"
              fill="var(--purple)"
            />
          </g>

          <g class="buddy-figure">
            <!-- Petites oreilles rondes -->
            <circle
              class="buddy-ear"
              cx="15"
              cy="17"
              r="3.4"
              fill="var(--purple)"
            />
            <circle
              class="buddy-ear"
              cx="33"
              cy="17"
              r="3.4"
              fill="var(--purple)"
            />

            <!-- Petits pieds -->
            <ellipse cx="18" cy="49" rx="4.4" ry="3" fill="var(--purple)" />
            <ellipse cx="30" cy="49" rx="4.4" ry="3" fill="var(--purple)" />

            <!-- Corps blob en dégradé inversé (purple → lightBlue) -->
            <path
              class="buddy-body"
              d="M24 14 C35 14 41 22 41 33 C41 44 33.5 50 24 50 C14.5 50 7 44 7 33 C7 22 13 14 24 14 Z"
              fill="url(#buddyBodyGradient)"
            />

            <!-- Ventre clair -->
            <ellipse
              cx="24"
              cy="40"
              rx="9"
              ry="6.5"
              fill="#f5f5f5"
              opacity="0.28"
            />

            <!-- Grands yeux brillants -->
            <g class="buddy-eyes">
              <circle cx="17.5" cy="30" r="5" fill="#f5f5f5" />
              <circle cx="30.5" cy="30" r="5" fill="#f5f5f5" />
              <g class="buddy-pupils">
                <circle cx="18.6" cy="30.4" r="2.6" fill="var(--dark-blue)" />
                <circle cx="31.6" cy="30.4" r="2.6" fill="var(--dark-blue)" />
                <circle cx="19.5" cy="29.3" r="0.9" fill="#f5f5f5" />
                <circle cx="32.5" cy="29.3" r="0.9" fill="#f5f5f5" />
              </g>
            </g>

            <!-- Joues roses -->
            <circle
              cx="12.5"
              cy="35.5"
              r="2.2"
              fill="var(--purple)"
              opacity="0.5"
            />
            <circle
              cx="35.5"
              cy="35.5"
              r="2.2"
              fill="var(--purple)"
              opacity="0.5"
            />

            <!-- Petit sourire -->
            <path
              class="buddy-mouth"
              d="M21.5 37.5 Q24 40 26.5 37.5"
              fill="none"
              stroke="var(--dark-blue)"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </g>
        </svg>
      </span>
    </span>
  </button>

  <!-- Curseur-guide : double décoratif du curseur custom du site (~1,5×,
       halo lumineux). Sur ordinateur, une seule fois par session et tant que
       la surprise du triple-clic n'a pas été découverte, il apparaît en
       fondu depuis le bord de l'écran, glisse en courbe douce jusqu'au
       robot, mime trois clics (ondes + sursauts du robot) avec sa bulle
       indice, puis s'évanouit. Le vrai curseur du visiteur n'est jamais
       déplacé. -->
  <div #cursorGuide class="cursor-guide" aria-hidden="true">
    <span class="guide-bubble">
      <span class="guide-bubble-text">
        Petit secret : cliquez trois fois sur lui !
      </span>
    </span>
    <span class="guide-bubble-arrow"></span>
    <span class="guide-halo"></span>
    <span class="guide-wave"></span>
    <!-- Même flèche que le curseur custom (styles.css), redessinée en SVG
         inline aux couleurs de la charte : corps nightBlue, liseré dégradé
         lightBlue → purple, pointe lumineuse. -->
    <svg class="guide-arrow" viewBox="0 0 24 24" width="36" height="36">
      <defs>
        <linearGradient id="guideArrowGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--light-blue)" />
          <stop offset="100%" stop-color="var(--purple)" />
        </linearGradient>
      </defs>
      <path
        d="M3 2 L3 17 L7.2 13.6 L9.7 19.6 L12.6 18.4 L10.1 12.5 L15.5 12.2 Z"
        fill="var(--night-blue)"
        stroke="url(#guideArrowGradient)"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
      <circle cx="3.8" cy="3" r="2.6" fill="var(--light-blue)" opacity="0.35" />
      <circle cx="3.6" cy="2.8" r="1.3" fill="var(--light-blue)" />
    </svg>
  </div>
}
