<section-header [icon]="BlueImage.Stack" title="Projets" />
<swiper-container
  effect="cards"
  cards-effect='{"slideShadows":false}'
  class="container"
  grab-cursor="true"
  keyboard="true"
  pagination="true"
  pagination-clickable="true"
  navigation="true"
>
  @for (project of projects; track project) {
    <swiper-slide>
      <project-item [project]="project" class="flex justify-center" />
    </swiper-slide>
  }
</swiper-container>
