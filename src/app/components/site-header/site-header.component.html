<header
  class="relative border-b transition-[background-color,border-color] duration-300"
  [class]="
    scrolled() || menuOpen()
      ? 'border-white/8 bg-darkBlue/85 backdrop-blur-lg'
      : 'border-transparent'
  "
>
  <div
    class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-5 sm:px-8"
  >
    <a
      href="#profil"
      class="group flex items-center gap-3 rounded-xl"
      (click)="closeMenu()"
    >
      <span
        aria-hidden="true"
        class="grid size-9 place-items-center rounded-xl bg-linear-to-br from-lightBlue to-purple p-px transition duration-300 group-hover:shadow-[0_0_18px_rgba(83,220,253,0.35)]"
      >
        <span
          class="grid size-full place-items-center rounded-[11px] bg-darkBlue font-display text-[13px] font-bold tracking-tight"
        >
          <span class="text-gradient">HG</span>
        </span>
      </span>
      <span class="font-display text-[15px] font-semibold tracking-tight">
        Hicham Guessab
      </span>
    </a>

    <nav aria-label="Sections" class="hidden lg:block">
      <ul class="flex items-center gap-1">
        @for (item of items; track item.id) {
          <li>
            <a
              [href]="'#' + item.id"
              [attr.aria-current]="spy.active() === item.id ? 'true' : null"
              class="group relative block rounded-full px-3.5 py-2 text-sm text-white/70 transition duration-200 hover:text-wildSand aria-[current=true]:text-wildSand"
            >
              {{ item.label }}
              <span
                aria-hidden="true"
                class="absolute inset-x-3.5 bottom-1 h-px scale-x-0 bg-linear-to-r from-lightBlue to-purple transition-transform duration-300 group-aria-[current=true]:scale-x-100"
              ></span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="flex items-center gap-2">
      <a href="#contact" class="btn btn-primary hidden sm:inline-flex">
        Me contacter
      </a>
      <button
        #menuToggle
        type="button"
        class="grid size-10 place-items-center rounded-xl border border-white/10 text-wildSand transition hover:border-lightBlue/50 hover:bg-white/5 lg:hidden"
        aria-controls="menu-mobile"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="sr-only">
          {{ menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu' }}
        </span>
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" class="size-5" />
      </button>
    </div>
  </div>

  <!-- Progression de lecture : animation liée au défilement, en CSS pur
       (masquée là où animation-timeline n'existe pas). -->
  <span aria-hidden="true" class="scroll-progress"></span>

  <!-- Menu mobile en surimpression (aucun décalage du contenu). -->
  <nav
    id="menu-mobile"
    aria-label="Sections"
    class="absolute inset-x-0 top-full border-y border-white/8 bg-darkBlue/95 shadow-[0_24px_48px_-12px_rgba(4,13,57,0.9)] backdrop-blur-lg lg:hidden"
    [hidden]="!menuOpen()"
  >
    <ul class="mx-auto flex max-w-6xl flex-col px-5 py-2 sm:px-8">
      @for (item of items; track item.id; let i = $index) {
        <li>
          <a
            [href]="'#' + item.id"
            [attr.aria-current]="spy.active() === item.id ? 'true' : null"
            class="flex items-center gap-4 rounded-xl px-2 py-3 text-lg text-white/75 transition hover:bg-white/5 hover:text-wildSand aria-[current=true]:text-wildSand"
            (click)="closeMenu()"
          >
            <span class="font-mono text-xs text-lightBlue/70 tabular-nums">
              0{{ i + 1 }}
            </span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
    <div class="mx-auto max-w-6xl px-5 pb-5 sm:px-8">
      <a href="#contact" class="btn btn-primary w-full" (click)="closeMenu()">
        Me contacter
      </a>
    </div>
  </nav>
</header>
