<!-- data-perch : point d'accroche des mascottes (cartes de la page). -->
<article
  data-perch="card"
  class="group relative h-full rounded-2xl p-px transition duration-300"
  [class]="
    highlight()
      ? 'bg-linear-to-br from-lightBlue to-purple shadow-[0_0_40px_-8px_rgba(168,140,255,0.45)]'
      : 'bg-white/8 hover:bg-lightBlue/35'
  "
>
  <div
    data-spotlight
    class="relative flex h-full flex-col rounded-[15px] bg-nightBlue p-6"
  >
    <div class="flex min-h-6 items-center justify-between gap-3">
      <p class="font-mono text-xs tracking-wider text-lightBlue/85 uppercase">
        <time [attr.datetime]="education().period.start">{{ period() }}</time>
      </p>
      @if (education().level; as level) {
        <span
          class="rounded-md px-2 py-0.5 text-xs font-semibold"
          [class]="
            highlight()
              ? 'bg-linear-to-r from-lightBlue to-purple text-darkBlue'
              : 'bg-white/6 text-white/75'
          "
        >
          {{ level }}
        </span>
      }
    </div>

    <h3
      class="mt-5 font-display text-2xl font-semibold tracking-tight text-wildSand"
    >
      {{ education().name }}
    </h3>
    <p class="mt-1 text-gradient font-medium">{{ education().field }}</p>

    <div
      aria-hidden="true"
      class="mt-5 h-px w-full bg-linear-to-r from-lightBlue/40 to-purple/40"
    ></div>

    <p class="mt-4 flex items-center gap-2 text-sm text-white/65">
      <app-icon name="map-pin" class="size-4 text-white/50" />
      {{ education().institution }}
    </p>
  </div>
</article>
