<section-header [icon]="BlueImage.Study" title="Formation" />
<swiper-container
  reveal
  [revealDelay]="150"
  effect="cards"
  cards-effect='{"slideShadows":false}'
  class="container"
  grab-cursor="true"
  keyboard="true"
  pagination="true"
  pagination-clickable="true"
  navigation="true"
>
  @for (degree of degrees; track degree) {
    <swiper-slide>
      <education-item [education]="degree" class="flex justify-center" />
    </swiper-slide>
  }
</swiper-container>
