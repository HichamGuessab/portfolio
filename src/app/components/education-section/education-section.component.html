<section
  id="formation"
  spySection="formation"
  aria-labelledby="formation-title"
  class="py-20 md:py-28"
>
  <div class="mx-auto max-w-6xl px-5 sm:px-8">
    <section-header
      index="04"
      eyebrow="Parcours académique"
      title="Formation"
      titleId="formation-title"
    >
      Huit ans de parcours, du baccalauréat scientifique au Master Ingénierie du
      logiciel de l’Université d’Avignon.
    </section-header>

    <!-- Frise chronologique : ligne de vie horizontale (md+) ou verticale. -->
    <ol class="degree-line relative grid gap-5 md:grid-cols-3">
      @for (
        degree of degrees;
        track degree.name;
        let i = $index;
        let last = $last
      ) {
        <li reveal [revealDelay]="i * 90" class="degree-step relative">
          <education-item [education]="degree" [highlight]="last" />
        </li>
      }
    </ol>
  </div>
</section>
