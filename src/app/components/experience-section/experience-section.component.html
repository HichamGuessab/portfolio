<section-header [icon]="BlueImage.Work" title="Expérience" />

<swiper-container
  navigation="true"
  effect="cards"
  cards-effect='{"slideShadows":false}'
  class="container"
  grab-cursor="true"
  keyboard="true"
  pagination="true"
  pagination-clickable="true"
>
  @for (experience of experiences; track experience) {
    <swiper-slide>
      <experience-item [experience]="experience" class="flex justify-center" />
    </swiper-slide>
  }
</swiper-container>
