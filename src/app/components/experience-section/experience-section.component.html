<section-header [icon]="BlueImage.Work" title="Expérience" />

<swiper-container
  reveal
  [revealDelay]="150"
  navigation="true"
  effect="cards"
  cards-effect='{"slideShadows":false}'
  class="container"
  grab-cursor="true"
  keyboard="true"
  pagination="true"
  pagination-clickable="true"
>
  @for (experience of experiences; track experience) {
    <swiper-slide>
      <!-- pt-1 : réserve la place de l'élévation au survol (hover:-translate-y-1),
           sinon le haut de la carte sort de la slide (overflow hidden, effet cards)
           et se fait rogner. -->
      <experience-item
        [experience]="experience"
        class="flex justify-center pt-1"
      />
    </swiper-slide>
  }
</swiper-container>
