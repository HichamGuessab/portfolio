<div
  class="flex h-auto min-h-120 w-80 flex-col justify-between gap-6 rounded-2xl border border-lightBlue bg-navyBlue p-6 transition duration-300 ease-out hover:-translate-y-1 hover:border-purple"
>
  <div class="flex flex-col">
    <h3 class="pb-2 text-2xl font-medium text-white">
      {{ experience().name }}
    </h3>
    <p
      class="pl-3 text-lg font-light italic"
      [innerHTML]="experience().description"
    ></p>
  </div>
  <div class="flex flex-col pl-3">
    <p class="text-end italic">
      {{ experience().company }}
    </p>
    <p class="text-end italic">
      {{ experience().date }}
    </p>
  </div>
</div>
