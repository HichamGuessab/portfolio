<main>
  <!-- La bascule diaporama / compact n'a pas de bouton : c'est un secret des
       mascottes — triple-clic sur l'un des deux compagnons (voir MascotComponent). -->
  @if (viewMode.isCompact()) {
    <!-- Mode compact « Circuit fermé » : pont de commandement une seule page
         plein écran, sans aucun défilement, ceinturé du cadre-circuit -->
    <compact-board />
  } @else {
    <!-- Mode diaporama : une section par écran (défaut) -->
    <swiper-container
      pagination="true"
      pagination-clickable="true"
      mousewheel="true"
      keyboard="true"
      direction="vertical"
      class="view-fade-in h-screen w-full overflow-x-hidden text-wildSand"
      css-mode="true"
    >
      <swiper-slide class="flex items-center justify-center overflow-x-hidden">
        <profile-section class="w-3/4" />
      </swiper-slide>
      <swiper-slide class="flex items-center justify-center overflow-x-hidden">
        <projects-section class="w-3/4" />
      </swiper-slide>
      <swiper-slide class="flex items-center justify-center overflow-x-hidden">
        <skills-section class="w-3/4" />
      </swiper-slide>
      <swiper-slide
        class="flex flex-col items-center justify-center overflow-x-hidden"
      >
        <experience-section class="w-3/4" />
      </swiper-slide>
      <swiper-slide
        class="flex flex-col items-center justify-center overflow-x-hidden"
      >
        <education-section class="w-3/4" />
      </swiper-slide>
    </swiper-container>
  }

  <!-- Duo de mascottes décoratif : le petit robot et son ami se promènent
       le long du bas de l'écran, discutent en bulles, réagissent à la page
       et, par moments, escaladent l'interface (tuiles projets, console,
       badges, cadre…) sans jamais la toucher ni bloquer un clic.
       Sur ordinateur, un triple-clic sur l'un d'eux bascule diaporama /
       compact (la « surprise » qu'ils teasent en bulles). Sur mobile, ils
       sont réduits (~70 %) et réagissent aux mouvements du téléphone
       (inclinaison, secousse) après un toucher qui active les capteurs.
       Position fixe, aucun impact sur le layout ; le duo est permanent —
       il porte le seul accès au mode compact. -->
  <app-mascot />
</main>
