<!-- Dégradé signature partagé par les icônes (fill / stroke url(#icon-gradient)). -->
<app-icon-defs />

<!-- La bascule page / compact n'a pas de bouton : c'est un secret des
     mascottes — triple-clic sur l'un des deux compagnons (voir MascotComponent). -->
@if (viewMode.isCompact()) {
  <!-- Mode compact « Circuit fermé » : pont de commandement une seule page
       plein écran, sans aucun défilement, ceinturé du cadre-circuit. Chargé
       à la demande : son code ne pèse rien tant que le secret n'est pas
       découvert. -->
  <main>
    @defer {
      <compact-board />
    }
  </main>
} @else {
  <!-- Page par défaut : une seule page qui défile, sections ancrées. -->
  <a href="#contenu" class="skip-link">Aller au contenu</a>
  <site-header />
  <main id="contenu" tabindex="-1" spotlightZone>
    <profile-section />
    <experience-section />
    <projects-section />
    <skills-section />
    <education-section />
    <contact-section />
  </main>
  <site-footer />
}

<!-- Duo de mascottes décoratif : le petit robot et son ami se promènent
     le long du bas de l'écran, discutent en bulles, réagissent à la page
     et, par moments, escaladent l'interface (cartes, badges, cadre…) sans
     jamais la toucher ni bloquer un clic. Sur ordinateur, un triple-clic sur
     l'un d'eux bascule page / compact. Sur mobile, ils sont réduits (~70 %)
     et réagissent aux mouvements du téléphone après un toucher.
     Chargé quand le navigateur est inoccupé : le contenu passe d'abord. -->
@defer (on idle) {
  <app-mascot />
}
